<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#325696" />
      <stop offset="100%" stop-color="#0f1a33" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Icon Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#gsGradient)" filter="url(#shadow)" stroke="#416ab0" stroke-width="8" />

  <!-- Monogram GS -->
  <text x="256" y="325" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="220" fill="#ffffff" text-anchor="middle" letter-spacing="4">GS</text>

  <!-- Eco Verification Green Dot Badge -->
  <circle cx="410" cy="102" r="50" fill="#408e3c" stroke="#ffffff" stroke-width="16" />
  <!-- White Checkmark -->
  <path d="M392 102 L405 115 L430 88" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
